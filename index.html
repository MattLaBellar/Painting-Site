<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Paint Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Pixel Paint Game</h1>
    <p>Click and drag to paint. Select the pencil or eraser below. Press "U" to undo.</p>
    
    <div id="grid"></div>
    
    <div id="controls">
        <button id="pencilButton">
            <img src="Pencil.png" alt="Pencil">
        </button>
        <button id="eraserButton">
            <img src="Eraser.png" alt="Eraser">
        </button>
        <input type="color" id="colorPicker" value="#000000">
        <label for="brushSize">Brush Size:</label>
        <input type="range" id="brushSize" min="1" max="10" step="0.5" value="1">
        <span id="brushSizeValue">1</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
